<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>送信完了｜SORANNCRAFT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background: #f0f2f5;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }
    .message-card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    .icon {
      font-size: 60px;
      color: #2c7be5;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 15px;
      color: #1a5ab3;
    }
    p {
      line-height: 1.6;
      margin-bottom: 30px;
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .back-btn {
      display: inline-block;
      background: #2c7be5;
      color: white;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: bold;
      transition: background 0.3s;
      width: 200px;
    }
    .back-btn:hover {
      background: #1a5ab3;
    }
    .form-link {
      color: #777;
      text-decoration: none;
      font-size: 12px;
    }
    .form-link:hover {
      text-decoration: underline;
    }
    .account-info {
      font-size: 11px;
      color: #ccc;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="message-card">
  <div class="icon">✅</div>
  <h1>送信の準備が整いました</h1>
  <p>
    以下のボタンから公式フォームを開き、<br>
    内容を入力して送信を完了させてください。
  </p>
  <div class="btn-group">
    <a href="https://forms.gle/Yu9zZXbbZC45GAyB9" class="back-btn">フォームを開く</a>
    <a href="index.html" class="form-link">トップページへ戻る</a>
  </div>
  <div class="account-info">
    ynakaoka1984@gmail.com としてログイン中（管理者用表示）
  </div>
</div>

</body>
</html>
